name: Code Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (errorlint, contextcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v2.8.0
          args: --timeout=5m

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Run unit tests
        run: go test ./...

  test-determinism:
    name: Test Determinism (3x runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Run tests 3 times
        run: |
          echo "Running tests 3 times to verify determinism..."
          for i in 1 2 3; do
            echo "Run $i/3"
            if ! go test ./...; then
              echo "❌ Tests failed on run $i"
              exit 1
            fi
          done
          echo "✅ All 3 test runs passed (deterministic)"
