name: Code Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (errorlint, contextcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
      
      - name: Run golangci-lint
        run: |
          golangci-lint run --timeout=5m

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Run unit tests
        run: go test -race ./...

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run integration tests
        run: make test-integration

  test-determinism:
    name: Test Determinism (3x runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Run tests 3 times
        run: |
          echo "Running tests 3 times to verify determinism..."
          for i in 1 2 3; do
            echo "Run $i/3"
            if ! go test -count=1 -shuffle=on ./...; then
              echo "❌ Tests failed on run $i"
              exit 1
            fi
          done
          echo "✅ All 3 test runs passed (deterministic)"
